# Entorno de desarrollo con Docker: Postgres + la app con el código
# montado y `runserver` (recarga automática), para no tener que instalar
# Python ni PostgreSQL en la máquina. Para producción, la misma imagen
# (Dockerfile) se usa con el comando por defecto (gunicorn) — ver la
# sección "Ejecutar con Docker" del README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ojo_avizor}
      POSTGRES_USER: ${DB_USER:-ojo_avizor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ojo_avizor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ojo_avizor} -d ${DB_NAME:-ojo_avizor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.desarrollo
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
